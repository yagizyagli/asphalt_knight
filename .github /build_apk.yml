name: Asphalt Knight APK Builder

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install App Dependencies
        run: flutter pub get

      - name: Direct Injection Patch for Telephony Legacy Error
        run: |
          TARGET_FILE="${HOME}/.pub-cache/hosted/pub.dev/telephony-0.2.0/android/build.gradle"
          
          if [ -f "$TARGET_FILE" ]; then
            echo "Target file found at: $TARGET_FILE"
            
            if grep -q "namespace " "$TARGET_FILE"; then
              echo "Namespace already exists, skipping..."
            else
              echo "Injecting namespace into telephony build.gradle..."
              sed -i '/android {/a \    namespace "com.shounakmulay.telephony"' "$TARGET_FILE"
              echo "Injection successful!"
            fi
          else
            echo "File not found at primary path, searching dynamically..."
            GENERIC_PATH=$(find ${HOME}/.pub-cache/hosted/pub.dev/ -name "build.gradle" | grep "telephony")
            if [ -n "$GENERIC_PATH" ]; then
              sed -i '/android {/a \    namespace "com.shounakmulay.telephony"' "$GENERIC_PATH"
              echo "Dynamic injection successful on: $GENERIC_PATH"
            else
              echo "Warning: Telephony build file could not be located."
            fi
          fi

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asphalt-knight-app
          path: build/app/outputs/flutter-apk/app-release.apk
