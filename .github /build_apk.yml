name: Asphalt Knight APK Builder

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install App Dependencies
        run: flutter pub get

      - name: Force Patch Telephony Namespace (Legacy Fix)
        run: |
          # Flutter'ın indirdiği paketlerin ana yoluna doğrudan gidiyoruz
          PUB_CACHE_DIR="${HOME}/.pub-cache/hosted/pub.dev"
          
          # Hangi sürüm olursa olsun telephony klasörünü nokta atışı buluyoruz
          TELEPHONY_PATH=$(find $PUB_CACHE_DIR -maxdepth 2 -type d -name "telephony-*" | head -n 1)
          
          if [ -n "$TELEPHONY_PATH" ]; then
            TARGET_GRADLE="${TELEPHONY_PATH}/android/build.gradle"
            if [ -f "$TARGET_GRADLE" ]; then
              echo "Found telephony build.gradle at: $TARGET_GRADLE"
              echo "Applying aggressive namespace patch..."
              
              # build.gradle dosyasının içine girip android { satırının hemen altına namespace ekliyoruz
              sed -i '/android {/a \    namespace "com.shounakmulay.telephony"' "$TARGET_GRADLE"
              
              echo "Patch applied successfully. Verifying content:"
              cat "$TARGET_GRADLE" | grep "namespace"
            else
              echo "Error: build.gradle not found inside telephony directory!"
              exit 1
            fi
          else
            echo "Error: Telephony package package could not be found in cache!"
            exit 1
          fi

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asphalt-knight-app
          path: build/app/outputs/flutter-apk/app-release.apk
