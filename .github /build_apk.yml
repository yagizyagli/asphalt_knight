name: Asphalt Knight APK Builder

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install App Dependencies
        run: flutter pub get

      - name: Patch Telephony Namespace Error (Fixing Legacy Dependency)
        run: |
          PUB_CACHE_DIR="${HOME}/.pub-cache/hosted/pub.dev"
          TELEPHONY_DIR=$(find $PUB_CACHE_DIR -type d -name "telephony-*" 2>/dev/null | head -n 1)
          if [ -d "$TELEPHONY_DIR" ]; then
            BUILD_GRADLE="${TELEPHONY_DIR}/android/build.gradle"
            if [ -f "$BUILD_GRADLE" ]; then
              echo "Patching legacy telephony build.gradle..."
              sed -i '/android {/a \    namespace "com.shounakmulay.telephony"' "$BUILD_GRADLE"
            fi
          fi

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asphalt-knight-app
          path: build/app/outputs/flutter-apk/app-release.apk
